<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Photography by Shunsuke Nakao.">
  <title>Photos — Shunsuke Nakao</title>
  <script src="https://use.typekit.net/ovn4xxu.js"></script>
  <script>try { Typekit.load({async: true}); } catch(e) {}</script>
  <link rel="stylesheet" href="assets/style.css">
  <link rel="stylesheet" href="assets/photo-atlas.css">
  <script src="assets/lang.js" defer></script>
  <script src="assets/photo-atlas.js" defer></script>
</head>
<body class="photos-page">
  <div class="site">
    <nav class="top-nav" aria-label="Site navigation">
      <a href="index.html">
        <span data-i18n="en">Profile</span><span data-i18n="ja">プロフィール</span>
      </a>
      <a href="activities.html">
        <span data-i18n="en">Photos</span><span data-i18n="ja">写真</span>
      </a>
      <div class="language" role="group" aria-label="Language">
        <button type="button" data-setlang="en" aria-pressed="true">EN</button>
        <span aria-hidden="true">/</span>
        <button type="button" data-setlang="ja" aria-pressed="false">JP</button>
      </div>
    </nav>

    <main>
      <header class="photos-head">
        <h1><span data-i18n="en">Photos</span><span data-i18n="ja">写真</span></h1>
      </header>
      <p class="muted">
        <span data-i18n="en">Landscapes and moments from the field.</span>
        <span data-i18n="ja">フィールド等での風景．</span>
      </p>

      <section class="atlas" aria-labelledby="atlas-heading">
        <div class="atlas-heading-row">
          <div>
            <h2 id="atlas-heading" class="atlas-heading">Atlas</h2>
          </div>
          <button id="atlas-reset" type="button" class="atlas-text-button">
            <span data-i18n="en">Show all photographs</span><span data-i18n="ja">すべての写真</span>
          </button>
        </div>
        <nav id="atlas-breadcrumb" class="atlas-breadcrumb" aria-label="Map location"></nav>
        <div class="atlas-map-frame">
          <div id="atlas-map" class="atlas-map" role="group" aria-label="Select a region on the map">
            <img id="atlas-map-image" class="atlas-map-image" src="assets/maps/world.svg" alt="Stylized world map">
            <div id="atlas-markers" class="atlas-markers"></div>
          </div>
          
        </div>
      </section>

      <section class="atlas-gallery-section" aria-labelledby="gallery-heading">
        <div class="atlas-gallery-head">
          <div>
            <h2 id="gallery-heading" class="atlas-heading">Photographs <span id="atlas-count" class="atlas-count"></span></h2>
          </div>
          <div id="atlas-categories" class="atlas-categories" role="group" aria-label="Filter by subject"></div>
        </div>
        <p id="atlas-empty" class="atlas-empty" hidden></p>
        <div id="photo-gallery" class="collage-gallery atlas-gallery"></div>
      </section>
    </main>

    <footer>© Shunsuke Nakao <span class="footer-dot">·</span>
      <a class="animated-link" href="index.html">snakao.jp</a>
    </footer>
  </div>

  <div id="collage-lightbox" class="collage-lightbox atlas-lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer" hidden>
    <button class="collage-close" type="button" aria-label="Close">×</button>
    <button class="collage-prev" type="button" aria-label="Previous">‹</button>
    <div class="atlas-viewer-main">
      <img class="collage-lightbox-image" alt="">
      <div class="atlas-viewer-info">
        <p id="collage-caption" class="collage-caption"></p>
        <p id="atlas-photo-location"></p>
        <p id="atlas-photo-coordinates"></p>
        <p id="atlas-photo-camera"></p>
        <div id="atlas-related" class="atlas-related"></div>
      </div>
    </div>
    <button class="collage-next" type="button" aria-label="Next">›</button>
    <span class="collage-counter"></span>
  </div>
  <!-- Optional: keep the Cloudflare analytics beacon from your original page here. -->
</body>
</html>
