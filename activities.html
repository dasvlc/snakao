<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Photography by Shunsuke Nakao.">
  <title>Photos — Shunsuke Nakao</title>
  <script src="https://use.typekit.net/ovn4xxu.js"></script>
  <script>try { Typekit.load({async: true}); } catch(e) {}</script>
  <link rel="stylesheet" href="assets/style.css">
  <script src="assets/lang.js" defer></script>
</head>
<body class="photos-page">
  <div class="site">
    <nav class="top-nav" aria-label="Site navigation">
      <a href="index.html">
        <span data-i18n="en">Profile</span>
        <span data-i18n="ja">プロフィール</span>
      </a>
      <a href="activities.html">
        <span data-i18n="en">Activities</span>
        <span data-i18n="ja">活動記録</span>
      </a>
      <div class="language" role="group" aria-label="Language">
        <button type="button" data-setlang="en" aria-pressed="true">EN</button>
        <span aria-hidden="true">/</span>
        <button type="button" data-setlang="ja" aria-pressed="false">JP</button>
      </div>
    </nav>

    <main>
      <div class="photos-head">
        <h1>
          <span data-i18n="en">Activities</span>
          <span data-i18n="ja">活動記録</span>
        </h1>
      </div>

        <p class="muted">
          <span data-i18n="en">Landscapes and moments from the field.</span>
          <span data-i18n="ja">フィールド等での風景．</span>
        </p>

      <div id="photo-gallery" class="collage-gallery"
           data-small="54"
           data-large="9"></div>
    </main>

    <footer>
      © Shunsuke Nakao
      <span class="footer-dot">·</span>
      <a class="animated-link" href="index.html">snakao.jp</a>
    </footer>
  </div>

  <div id="collage-lightbox" class="collage-lightbox" role="dialog"
       aria-modal="true" aria-label="Photo viewer" hidden>
    <button class="collage-close" type="button" aria-label="Close">×</button>
    <button class="collage-prev" type="button" aria-label="Previous">‹</button>
    <img class="collage-lightbox-image" alt="">
    <button class="collage-next" type="button" aria-label="Next">›</button>
    <span class="collage-counter"></span>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const gallery = document.getElementById("photo-gallery");
      const lightbox = document.getElementById("collage-lightbox");
      const viewer = lightbox.querySelector(".collage-lightbox-image");
      const counter = lightbox.querySelector(".collage-counter");
      const closeButton = lightbox.querySelector(".collage-close");
      const prevButton = lightbox.querySelector(".collage-prev");
      const nextButton = lightbox.querySelector(".collage-next");
      const photos = [];
      let currentIndex = 0;
      let lastFocused = null;
      let resizePending = false;

      for (const size of ["small", "large"]) {
        const count = Number(gallery.dataset[size] || 0);
        for (let i = 1; i <= count; i++) {
          const number = String(i).padStart(2, "0");
          photos.push({
            src: `assets/photos/${size}/IMG_${number}.jpg`,
            size
          });
        }
      }

      for (let i = photos.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [photos[i], photos[j]] = [photos[j], photos[i]];
      }

      function resizeGallery() {
        const styles = getComputedStyle(gallery);
        const row = parseFloat(styles.gridAutoRows);
        const gap = parseFloat(styles.rowGap);
        gallery.querySelectorAll(".collage-item").forEach(item => {
          const img = item.querySelector("img");
          if (!img || !img.naturalWidth) return;
          const height = img.getBoundingClientRect().height;
          item.style.gridRowEnd = `span ${Math.max(1, Math.ceil((height + gap) / (row + gap)))}`;
        });
      }

      function scheduleResize() {
        if (resizePending) return;
        resizePending = true;
        requestAnimationFrame(() => {
          resizePending = false;
          resizeGallery();
        });
      }

      function showPhoto() {
        const photo = photos[currentIndex];
        viewer.src = photo.src;
        counter.textContent = `${currentIndex + 1} / ${photos.length}`;
      }

      function openLightbox(index, element) {
        currentIndex = index;
        lastFocused = element;
        showPhoto();
        lightbox.hidden = false;
        document.body.classList.add("lightbox-open");
        closeButton.focus();
      }

      function closeLightbox() {
        lightbox.hidden = true;
        viewer.removeAttribute("src");
        document.body.classList.remove("lightbox-open");
        if (lastFocused?.isConnected) lastFocused.focus();
      }

      function movePhoto(direction) {
        if (!photos.length) return;
        currentIndex = (currentIndex + direction + photos.length) % photos.length;
        showPhoto();
      }

      photos.forEach((photo, index) => {
        const link = document.createElement("a");
        link.className = `collage-item ${photo.size === "large" ? "large" : ""}`;
        link.href = photo.src;
        link.setAttribute("aria-label", `Open photo ${index + 1}`);

        const img = document.createElement("img");
        img.src = photo.src;
        img.alt = "";
        img.decoding = "async";

        img.addEventListener("load", scheduleResize);
        img.addEventListener("error", () => {
          link.remove();
          const i = photos.indexOf(photo);
          if (i !== -1) photos.splice(i, 1);
          scheduleResize();
        });

        link.appendChild(img);
        gallery.appendChild(link);

        link.addEventListener("click", event => {
          event.preventDefault();
          if (!img.naturalWidth) return;
          openLightbox(photos.indexOf(photo), link);
        });
      });

      closeButton.addEventListener("click", closeLightbox);
      prevButton.addEventListener("click", () => movePhoto(-1));
      nextButton.addEventListener("click", () => movePhoto(1));

      lightbox.addEventListener("click", event => {
        if (event.target === lightbox) closeLightbox();
      });

      document.addEventListener("keydown", event => {
        if (lightbox.hidden) return;
        if (event.key === "Escape") closeLightbox();
        if (event.key === "ArrowLeft") movePhoto(-1);
        if (event.key === "ArrowRight") movePhoto(1);
        if (event.key === "Tab") {
          const controls = [closeButton, prevButton, nextButton];
          const i = controls.indexOf(document.activeElement);
          if (event.shiftKey && i <= 0) {
            event.preventDefault();
            nextButton.focus();
          } else if (!event.shiftKey && i === controls.length - 1) {
            event.preventDefault();
            closeButton.focus();
          }
        }
      });

      window.addEventListener("resize", scheduleResize);
      scheduleResize();
    });
  </script>
</body>
</html>
